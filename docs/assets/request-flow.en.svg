<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">From a message to a useful result</title><desc id="desc">Receive a message, ask the model, and inspect its decision. Tool calls are executed and their observations loop back to the model. If no tool is requested, return the answer.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4faf5"/><stop offset="1" stop-color="#eef5fa"/></linearGradient>
<linearGradient id="tile" x2="1" y2="1"><stop stop-color="#c4f0df"/><stop offset="1" stop-color="#eefbf5"/></linearGradient>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#218976" stroke-width="1.5"/></marker>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6383bc" stroke-width="1.5"/></marker>
</defs>
<rect width="1440" height="1080" rx="30" fill="url(#bg)"/>
<g font-family="Noto Sans KR, Noto Sans CJK KR, Arial, sans-serif">
<text x="64" y="60" font-size="18" font-weight="700" fill="#218976" text-anchor="start">AGENT STARTER TEMPLATE / REQUEST FLOW</text>
<text x="64" y="121" font-size="44" font-weight="700" fill="#153c39" text-anchor="start">From a message to a useful result</text>
<text x="64" y="163" font-size="23" font-weight="400" fill="#526f6c" text-anchor="start">Follow the tool loop, then return a final answer.</text>
<path d="M420 306H525" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="472" y="286" font-size="19" font-weight="500" fill="#218976" text-anchor="middle">input</text><path d="M910 306H1005" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1200 400V484" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1005 575H910" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="958" y="555" font-size="20" font-weight="500" fill="#218976" text-anchor="middle">Yes</text><path d="M535 575H420" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="478" y="555" font-size="20" font-weight="500" fill="#218976" text-anchor="middle">results</text><path d="M240 485V446H705V406" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="465" y="431" font-size="20" font-weight="500" fill="#218976" text-anchor="middle">next decision</text><path d="M1200 670V758" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1232" y="720" font-size="20" font-weight="500" fill="#218976" text-anchor="middle">No</text><rect x="65" y="221" width="355" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="65" y="215" width="355" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="87" y="237" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(95 244)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="42" height="31" rx="6"/><path d="M14 15l-5 6 5 6m20-12 5 6-5 6M19 42h10M24 36v6"/></g><text x="87" y="334" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">1. Receive a message</text><text x="87" y="366" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Validate input and thread</text><text x="87" y="391" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">POST /v1/runs</text><rect x="535" y="221" width="375" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="535" y="215" width="375" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="557" y="237" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(565 244)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="38" height="29" rx="10"/><path d="M24 5v7M1 22v10m46-10v10"/><circle cx="16" cy="25" r="2" fill="#218976"/><circle cx="32" cy="25" r="2" fill="#218976"/><path d="M18 33h12"/></g><text x="557" y="334" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">2. Ask the model</text><text x="557" y="366" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Check model-call budget</text><text x="557" y="391" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">Prompt + conversation history</text><rect x="1015" y="221" width="360" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="1015" y="215" width="360" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="1037" y="237" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(1045 244)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M24 3l7 14 14 7-14 7-7 14-7-14-14-7 14-7z"/></g><text x="1037" y="334" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">3. Read the decision</text><text x="1037" y="366" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Answer or tool calls</text><text x="1037" y="391" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">Demo rules / real model</text><rect x="1015" y="496" width="360" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="1015" y="490" width="360" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="1037" y="512" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(1045 519)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h30M9 24h30M9 36h30"/><circle cx="17" cy="12" r="4" fill="#e1f5ee"/><circle cx="32" cy="24" r="4" fill="#e1f5ee"/><circle cx="20" cy="36" r="4" fill="#e1f5ee"/></g><text x="1037" y="609" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">Tools requested?</text><text x="1037" y="641" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Branch on the model output</text><rect x="535" y="496" width="375" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="535" y="490" width="375" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="557" y="512" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(565 519)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14V8h30v6M4 17h40v25H4zM4 27h40M20 24h8v7h-8z"/></g><text x="557" y="609" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">4. Execute tools</text><text x="557" y="641" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Budget + allowlist + schema</text><text x="557" y="666" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">Read-only calls with timeouts</text><rect x="65" y="496" width="355" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="65" y="490" width="355" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="87" y="512" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(95 519)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="9" rx="19" ry="7"/><path d="M5 9v28c0 9 38 9 38 0V9M5 22c0 9 38 9 38 0"/></g><text x="87" y="609" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">5. Add observations</text><text x="87" y="641" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Return results to the model</text><text x="87" y="666" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">Checkpoint each graph step</text><rect x="1015" y="771" width="360" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="1015" y="765" width="360" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="1037" y="787" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(1045 794)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 25l10 10L40 12"/></g><text x="1037" y="884" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">6. Return an answer</text><text x="1037" y="916" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Output + status + usage</text><text x="1037" y="941" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">completed</text><rect x="65" y="764" width="845" height="191" rx="24" fill="#e2efe9"/><text x="90" y="807" font-size="21" font-weight="700" fill="#218976" text-anchor="start">EXAMPLE: 12 * 7</text><text x="90" y="850" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">calculate(multiply, 12, 7) returns 84.0</text><text x="90" y="890" font-size="22" font-weight="400" fill="#526f6c" text-anchor="start">The result goes back to the model for the final response.</text><text x="90" y="926" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Demo mode uses two scripted model calls; no paid API.</text><text x="65" y="1006" font-size="21" font-weight="500" fill="#526f6c" text-anchor="start">Limits stop the loop. A timeout returns 504; inspect the thread before resuming.</text><text x="65" y="1041" font-size="19" font-weight="400" fill="#526f6c" text-anchor="start">Main success path shown. Model errors return model_error; tool errors are observations.</text>
</g></svg>