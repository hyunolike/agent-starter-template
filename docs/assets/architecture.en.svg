<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
<title id="title">How the pieces fit together</title><desc id="desc">FastAPI calls the coordinator, which starts or resumes the graph. The graph calls the model adapter and typed tools, and writes checkpoints to SQLite. Tools call business services.</desc>
<defs>
