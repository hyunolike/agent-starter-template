="700" fill="#218976" text-anchor="end">STATE</text><text x="1002" y="344" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">SQLite</text><text x="1002" y="376" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Messages + saved graph state</text><text x="1002" y="401" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">persistence/</text><rect x="480" y="496" width="340" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="480" y="490" width="340" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="502" y="512" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(510 519)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="38" height="29" rx="10"/><path d="M24 5v7M1 22v10m46-10v10"/><circle cx="16" cy="25" r="2" fill="#218976"/><circle cx="32" cy="25" r="2" fill="#218976"/><path d="M18 33h12"/></g><text x="798" y="532" font-size="17" font-weight="700" fill="#218976" text-anchor="end">03</text><text x="502" y="609" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">LangGraph</text><text x="502" y="641" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Model decision + tool loop</text><text x="502" y="666" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">agent/</text><rect x="70" y="496" width="310" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="70" y="490" width="310" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="92" y="512" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(100 519)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M24 3l7 14 14 7-14 7-7 14-7-14-14-7 14-7z"/></g><text x="358" y="532" font-size="17" font-weight="700" fill="#218976" text-anchor="end">MODEL</text><text x="92" y="609" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">Model adapter</text><text x="92" y="641" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Demo / Anthropic</text><text x="92" y="666" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">integrations/</text><rect x="980" y="496" width="370" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="980" y="490" width="370" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="1002" y="512" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(1010 519)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14V8h30v6M4 17h40v25H4zM4 27h40M20 24h8v7h-8z"/></g><text x="1328" y="532" font-size="17" font-weight="700" fill="#218976" text-anchor="end">04</text><text x="1002" y="609" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">Typed tools</text><text x="1002" y="641" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Allowlist + validation + timeout</text><text x="1002" y="666" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">tools/ + policies/</text><rect x="980" y="761" width="370" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="980" y="755" width="370" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="1002" y="777" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(1010 784)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="34" height="42" rx="6"/><path d="M15 14h18M15 24h18M15 34h10"/></g><text x="1328" y="797" font-size="17" font-weight="700" fill="#218976" text-anchor="end">05</text><text x="1002" y="874" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">Business services</text><text x="1002" y="906" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Policy search / request status</text><text x="1002" y="931" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">Fictional data · read-only</text><text x="70" y="808" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">The model chooses. The application executes.</text><text x="70" y="850" font-size="22" font-weight="400" fill="#526f6c" text-anchor="start">Tools call services; business rules stay out of prompts.</text><text x="70" y="887" font-size="22" font-weight="400" fill="#526f6c" text-anchor="start">SQLite checkpoints preserve completed graph steps.</text><path d="M72 966H132" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="148" y="974" font-size="19" font-weight="400" fill="#526f6c" text-anchor="start">Execution</text><path d="M330 966H390" fill="none" stroke="#6383bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="9 8"/><text x="405" y="974" font-size="19" font-weight="400" fill="#526f6c" text-anchor="start">Checkpoint writes</text><text x="1368" y="974" font-size="18" font-weight="400" fill="#526f6c" text-anchor="end">Single tenant · one worker · read-only demo</text>
