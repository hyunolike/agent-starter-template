<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
<title id="title">구성요소가 어떻게 연결될까요?</title><desc id="desc">FastAPI에서 실행 조정을 거쳐 그래프를 실행합니다. 그래프는 모델과 도구를 호출하고 SQLite에 체크포인트를 저장합니다. 도구가 업무 서비스를 호출합니다.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4faf5"/><stop offset="1" stop-color="#eef5fa"/></linearGradient>
<linearGradient id="tile" x2="1" y2="1"><stop stop-color="#c4f0df"/><stop offset="1" stop-color="#eefbf5"/></linearGradient>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#218976" stroke-width="1.5"/></marker>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6383bc" stroke-width="1.5"/></marker>
</defs>
<rect width="1440" height="1020" rx="30" fill="url(#bg)"/>
<g font-family="Noto Sans KR, Noto Sans CJK KR, Arial, sans-serif">
<text x="64" y="60" font-size="18" font-weight="700" fill="#218976" text-anchor="start">AGENT STARTER TEMPLATE / ARCHITECTURE</text>
<text x="64" y="121" font-size="44" font-weight="700" fill="#153c39" text-anchor="start">구성요소가 어떻게 연결될까요?</text>
<text x="64" y="163" font-size="23" font-weight="400" fill="#526f6c" text-anchor="start">각 구성요소의 역할을 분리한 작은 에이전트 서비스입니다.</text>
<path d="M380 317H470" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="425" y="298" font-size="20" font-weight="500" fill="#218976" text-anchor="middle">HTTP</text><path d="M650 410V480" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="750" y="452" font-size="20" font-weight="500" fill="#218976" text-anchor="middle">실행 / 재개</text><path d="M480 582H390" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="435" y="560" font-size="20" font-weight="500" fill="#218976" text-anchor="middle">호출</text><path d="M820 620H970" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="896" y="600" font-size="20" font-weight="500" fill="#218976" text-anchor="middle">실행</text><path d="M820 535H889V320H970" fill="none" stroke="#6383bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="9 8"/><text x="894" y="296" font-size="20" font-weight="500" fill="#6383bc" text-anchor="middle">상태 저장</text><path d="M1150 675V745" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1252" y="718" font-size="20" font-weight="500" fill="#218976" text-anchor="middle">서비스 호출</text><rect x="70" y="231" width="310" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="70" y="225" width="310" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="92" y="247" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(100 254)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="42" height="31" rx="6"/><path d="M14 15l-5 6 5 6m20-12 5 6-5 6M19 42h10M24 36v6"/></g><text x="358" y="267" font-size="17" font-weight="700" fill="#218976" text-anchor="end">01</text><text x="92" y="344" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">FastAPI</text><text x="92" y="376" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">요청 검증 + 선택형 토큰</text><text x="92" y="401" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">api/</text><rect x="480" y="231" width="340" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="480" y="225" width="340" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="502" y="247" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(510 254)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h30M9 24h30M9 36h30"/><circle cx="17" cy="12" r="4" fill="#e1f5ee"/><circle cx="32" cy="24" r="4" fill="#e1f5ee"/><circle cx="20" cy="36" r="4" fill="#e1f5ee"/></g><text x="798" y="267" font-size="17" font-weight="700" fill="#218976" text-anchor="end">02</text><text x="502" y="344" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">실행 조정</text><text x="502" y="376" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">대화별 동시 실행 차단 · 시간 제한</text><text x="502" y="401" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">services/runtime.py</text><rect x="980" y="231" width="370" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="980" y="225" width="370" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="1002" y="247" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(1010 254)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="9" rx="19" ry="7"/><path d="M5 9v28c0 9 38 9 38 0V9M5 22c0 9 38 9 38 0"/></g><text x="1328" y="267" font-size="17" font-weight="700" fill="#218976" text-anchor="end">STATE</text><text x="1002" y="344" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">SQLite</text><text x="1002" y="376" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">메시지 · 그래프 상태 저장</text><text x="1002" y="401" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">persistence/</text><rect x="480" y="496" width="340" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="480" y="490" width="340" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="502" y="512" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(510 519)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="38" height="29" rx="10"/><path d="M24 5v7M1 22v10m46-10v10"/><circle cx="16" cy="25" r="2" fill="#218976"/><circle cx="32" cy="25" r="2" fill="#218976"/><path d="M18 33h12"/></g><text x="798" y="532" font-size="17" font-weight="700" fill="#218976" text-anchor="end">03</text><text x="502" y="609" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">LangGraph</text><text x="502" y="641" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">모델 판단 · 도구 실행 반복</text><text x="502" y="666" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">agent/</text><rect x="70" y="496" width="310" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="70" y="490" width="310" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="92" y="512" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(100 519)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M24 3l7 14 14 7-14 7-7 14-7-14-14-7 14-7z"/></g><text x="358" y="532" font-size="17" font-weight="700" fill="#218976" text-anchor="end">MODEL</text><text x="92" y="609" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">모델 어댑터</text><text x="92" y="641" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">Demo / Anthropic</text><text x="92" y="666" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">integrations/</text><rect x="980" y="496" width="370" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="980" y="490" width="370" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="1002" y="512" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(1010 519)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14V8h30v6M4 17h40v25H4zM4 27h40M20 24h8v7h-8z"/></g><text x="1328" y="532" font-size="17" font-weight="700" fill="#218976" text-anchor="end">04</text><text x="1002" y="609" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">타입이 정의된 도구</text><text x="1002" y="641" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">허용 목록 · 입력 검증 · 시간 제한</text><text x="1002" y="666" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">tools/ + policies/</text><rect x="980" y="761" width="370" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="980" y="755" width="370" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="1002" y="777" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(1010 784)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="34" height="42" rx="6"/><path d="M15 14h18M15 24h18M15 34h10"/></g><text x="1328" y="797" font-size="17" font-weight="700" fill="#218976" text-anchor="end">05</text><text x="1002" y="874" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">업무 서비스</text><text x="1002" y="906" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">문서 검색 / 요청 상태 조회</text><text x="1002" y="931" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">가상 데이터 · 읽기 전용</text><text x="70" y="808" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">모델은 선택하고, 애플리케이션이 실행합니다.</text><text x="70" y="850" font-size="22" font-weight="400" fill="#526f6c" text-anchor="start">도구는 서비스를 호출하고, 업무 규칙은 코드로 관리합니다.</text><text x="70" y="887" font-size="22" font-weight="400" fill="#526f6c" text-anchor="start">완료된 그래프 단계는 SQLite 체크포인트로 보존합니다.</text><path d="M72 966H132" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="148" y="974" font-size="19" font-weight="400" fill="#526f6c" text-anchor="start">실행 호출</text><path d="M330 966H390" fill="none" stroke="#6383bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="9 8"/><text x="405" y="974" font-size="19" font-weight="400" fill="#526f6c" text-anchor="start">체크포인트 저장</text><text x="1368" y="974" font-size="18" font-weight="400" fill="#526f6c" text-anchor="end">단일 테넌트 · 워커 1개 · 읽기 전용 데모</text>
</g></svg>