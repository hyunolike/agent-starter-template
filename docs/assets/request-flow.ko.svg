<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">요청 한 건은 어떻게 처리될까요?</title><desc id="desc">요청을 받고 모델에 판단을 요청합니다. 도구 호출이 있으면 실행 결과를 모델에 다시 전달합니다. 도구 호출이 없으면 최종 응답을 반환합니다.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4faf5"/><stop offset="1" stop-color="#eef5fa"/></linearGradient>
<linearGradient id="tile" x2="1" y2="1"><stop stop-color="#c4f0df"/><stop offset="1" stop-color="#eefbf5"/></linearGradient>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#218976" stroke-width="1.5"/></marker>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6383bc" stroke-width="1.5"/></marker>
</defs>
<rect width="1440" height="1080" rx="30" fill="url(#bg)"/>
<g font-family="Noto Sans KR, Noto Sans CJK KR, Arial, sans-serif">
<text x="64" y="60" font-size="18" font-weight="700" fill="#218976" text-anchor="start">AGENT STARTER TEMPLATE / REQUEST FLOW</text>
<text x="64" y="121" font-size="44" font-weight="700" fill="#153c39" text-anchor="start">요청 한 건은 어떻게 처리될까요?</text>
<text x="64" y="163" font-size="23" font-weight="400" fill="#526f6c" text-anchor="start">필요한 도구를 실행하고 결과를 확인한 뒤 최종 응답을 만듭니다.</text>
<path d="M420 306H525" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="472" y="286" font-size="19" font-weight="500" fill="#218976" text-anchor="middle">입력</text><path d="M910 306H1005" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1200 400V484" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1005 575H910" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="958" y="555" font-size="20" font-weight="500" fill="#218976" text-anchor="middle">예</text><path d="M535 575H420" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="478" y="555" font-size="20" font-weight="500" fill="#218976" text-anchor="middle">결과</text><path d="M240 485V446H705V406" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="465" y="431" font-size="20" font-weight="500" fill="#218976" text-anchor="middle">다음 판단</text><path d="M1200 670V758" fill="none" stroke="#218976" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1232" y="720" font-size="20" font-weight="500" fill="#218976" text-anchor="middle">아니요</text><rect x="65" y="221" width="355" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="65" y="215" width="355" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="87" y="237" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(95 244)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="42" height="31" rx="6"/><path d="M14 15l-5 6 5 6m20-12 5 6-5 6M19 42h10M24 36v6"/></g><text x="87" y="334" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">1. 요청 받기</text><text x="87" y="366" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">입력과 대화 상태 검증</text><text x="87" y="391" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">POST /v1/runs</text><rect x="535" y="221" width="375" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="535" y="215" width="375" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="557" y="237" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(565 244)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="38" height="29" rx="10"/><path d="M24 5v7M1 22v10m46-10v10"/><circle cx="16" cy="25" r="2" fill="#218976"/><circle cx="32" cy="25" r="2" fill="#218976"/><path d="M18 33h12"/></g><text x="557" y="334" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">2. 모델에 판단 요청</text><text x="557" y="366" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">모델 호출 횟수 확인</text><text x="557" y="391" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">프롬프트 + 대화 기록</text><rect x="1015" y="221" width="360" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="1015" y="215" width="360" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="1037" y="237" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(1045 244)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M24 3l7 14 14 7-14 7-7 14-7-14-14-7 14-7z"/></g><text x="1037" y="334" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">3. 판단 결과 확인</text><text x="1037" y="366" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">최종 응답 또는 도구 호출</text><text x="1037" y="391" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">데모 규칙 / 실제 모델</text><rect x="1015" y="496" width="360" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="1015" y="490" width="360" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="1037" y="512" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(1045 519)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h30M9 24h30M9 36h30"/><circle cx="17" cy="12" r="4" fill="#e1f5ee"/><circle cx="32" cy="24" r="4" fill="#e1f5ee"/><circle cx="20" cy="36" r="4" fill="#e1f5ee"/></g><text x="1037" y="609" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">도구 호출이 필요한가요?</text><text x="1037" y="641" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">모델 출력에 따라 분기</text><rect x="535" y="496" width="375" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="535" y="490" width="375" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="557" y="512" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(565 519)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14V8h30v6M4 17h40v25H4zM4 27h40M20 24h8v7h-8z"/></g><text x="557" y="609" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">4. 도구 실행</text><text x="557" y="641" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">횟수 · 허용 목록 · 입력 검증</text><text x="557" y="666" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">시간 제한 내 읽기 전용 실행</text><rect x="65" y="496" width="355" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="65" y="490" width="355" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="87" y="512" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(95 519)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="9" rx="19" ry="7"/><path d="M5 9v28c0 9 38 9 38 0V9M5 22c0 9 38 9 38 0"/></g><text x="87" y="609" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">5. 결과를 대화에 추가</text><text x="87" y="641" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">실행 결과를 모델에 전달</text><text x="87" y="666" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">각 그래프 단계 체크포인트 저장</text><rect x="1015" y="771" width="360" height="185" rx="24" fill="#dbe9e3" opacity=".7"/><rect x="1015" y="765" width="360" height="185" rx="24" fill="white" stroke="#cce0d7" stroke-width="1.5"/><rect x="1037" y="787" width="64" height="64" rx="19" fill="url(#tile)"/><g transform="translate(1045 794)" fill="none" stroke="#218976" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 25l10 10L40 12"/></g><text x="1037" y="884" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">6. 최종 응답 반환</text><text x="1037" y="916" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">응답 + 상태 + 사용량</text><text x="1037" y="941" font-size="17" font-weight="400" fill="#526f6c" text-anchor="start">completed</text><rect x="65" y="764" width="845" height="191" rx="24" fill="#e2efe9"/><text x="90" y="807" font-size="21" font-weight="700" fill="#218976" text-anchor="start">예시: 12 * 7</text><text x="90" y="850" font-size="28" font-weight="700" fill="#153c39" text-anchor="start">calculate(multiply, 12, 7) → 84.0</text><text x="90" y="890" font-size="22" font-weight="400" fill="#526f6c" text-anchor="start">실행 결과를 모델에 전달한 뒤 최종 응답을 만듭니다.</text><text x="90" y="926" font-size="20" font-weight="400" fill="#526f6c" text-anchor="start">데모는 규칙 기반 모델 호출 2회로 처리하며 API 비용이 없습니다.</text><text x="65" y="1006" font-size="21" font-weight="500" fill="#526f6c" text-anchor="start">한도에 도달하면 반복을 종료합니다. 시간 초과는 504를 반환하며 대화 상태 확인 후 재개합니다.</text><text x="65" y="1041" font-size="19" font-weight="400" fill="#526f6c" text-anchor="start">정상 흐름 중심의 그림입니다. 모델 오류는 model_error, 도구 오류는 실행 결과로 전달합니다.</text>
</g></svg>